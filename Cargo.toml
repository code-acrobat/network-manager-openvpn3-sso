[package]
name = "nm-openvpn3-sso"
version = "0.4.20"
edition = "2024"
authors = ["Joseph R. Quinn <quinn.josephr@protonmail.com>"]
license = "MIT"
description = "NetworkManager VPN plugin for the OpenVPN 3 Linux client with SSO web authentication"
repository = "https://github.com/quinnjr/network-manager-openvpn-sso"
homepage = "https://github.com/quinnjr/network-manager-openvpn-sso"
keywords = ["networkmanager", "openvpn", "sso", "oauth", "vpn"]
categories = ["network-programming", "authentication"]

[[bin]]
name = "nm-openvpn3-sso-service"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Streaming
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

[profile.release]
lto = true
strip = true

# Debian package configuration (cargo-deb)
[package.metadata.deb]
name = "networkmanager-openvpn3-sso"
maintainer = "Joseph R. Quinn <quinn.josephr@protonmail.com>"
copyright = "2026, Joseph R. Quinn"
license-file = ["LICENSE", "0"]
extended-description = """\
A NetworkManager VPN plugin that runs VPN sessions through the OpenVPN 3 \
Linux client (openvpn3 D-Bus services), enabling server-driven web / SSO \
authentication (e.g. Yubikey) that the openvpn2 management-interface plugin \
cannot support. Profiles are imported into the openvpn3 configuration \
manager and session state is relayed to NetworkManager."""
depends = "$auto, openvpn3, network-manager"
section = "net"
priority = "optional"
assets = [
    ["target/release/nm-openvpn3-sso-service", "/usr/lib/nm-openvpn3-sso-service", "755"],
    ["data/nm-openvpn3-sso-service.name", "/usr/lib/NetworkManager/VPN/nm-openvpn3-sso-service.name", "644"],
    ["data/org.freedesktop.NetworkManager.openvpn3-sso.conf", "/usr/share/dbus-1/system.d/nm-openvpn3-sso-service.conf", "644"],
    ["data/vpn-sso-connect.sh", "/usr/bin/vpn-sso-connect", "755"],
    ["data/vpn-sso-connect.desktop", "/usr/share/applications/vpn-sso-connect.desktop", "644"],
    ["LICENSE", "/usr/share/doc/networkmanager-openvpn3-sso/LICENSE", "644"],
]

# RPM package configuration (cargo-generate-rpm)
[package.metadata.generate-rpm]
name = "networkmanager-openvpn3-sso"
license = "MIT"
assets = [
    { source = "target/release/nm-openvpn3-sso-service", dest = "/usr/lib/nm-openvpn3-sso-service", mode = "755" },
    { source = "data/nm-openvpn3-sso-service.name", dest = "/usr/lib/NetworkManager/VPN/nm-openvpn3-sso-service.name", mode = "644" },
    { source = "data/org.freedesktop.NetworkManager.openvpn3-sso.conf", dest = "/usr/share/dbus-1/system.d/nm-openvpn3-sso-service.conf", mode = "644" },
    { source = "data/vpn-sso-connect.sh", dest = "/usr/bin/vpn-sso-connect", mode = "755" },
    { source = "data/vpn-sso-connect.desktop", dest = "/usr/share/applications/vpn-sso-connect.desktop", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/networkmanager-openvpn3-sso/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
NetworkManager = "*"
openvpn3 = "*"
